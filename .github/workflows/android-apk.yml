name: Build DroneSim APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -q DroneSimAndroid-with-APK-build-workflow.zip

      - name: Build APK
        run: |
          cd DroneSimAndroid
          gradle :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DroneSim-APK
          path: DroneSimAndroid/app/build/outputs/apk/debug/*.apk
